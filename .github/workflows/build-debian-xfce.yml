name: Build Vanilla Linux XFCE ISO

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vanilla Linux XFCE live ISO
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap debian-archive-keyring \
            squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed \
            shim-signed mtools dosfstools syslinux-common isolinux

      - name: Configure Vanilla Linux XFCE
        run: |
          set -euxo pipefail
          chmod +x auto/config config/hooks/live/9999-vanilla-branding.chroot

          # Remove only generated live-build state from a previous configuration.
          # Tracked package lists, includes, hooks, and branding remain untouched.
          sudo rm -rf config/common config/bootstrap config/chroot config/binary config/source
          sudo rm -f config/archives/*.list config/archives/*.list.chroot config/archives/*.list.binary config/archives/*.list.chroot_binary

          ./auto/config

          # Never allow Ubuntu host defaults to leak into the Debian build.
          if grep -R -nE 'linux-generic|security\.ubuntu\.com|archive\.ubuntu\.com/ubuntu' config 2>/dev/null; then
            echo "ERROR: Ubuntu/stale live-build configuration detected"
            exit 1
          fi

      - name: Build ISO
        run: |
          set -euxo pipefail
          sudo lb build 2>&1 | tee build.log

      - name: Verify and rename ISO
        run: |
          set -euxo pipefail
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          cp "$ISO" vanilla-linux-xfce-amd64.iso
          file vanilla-linux-xfce-amd64.iso
          ls -lh vanilla-linux-xfce-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-linux-xfce-amd64
          path: |
            vanilla-linux-xfce-amd64.iso
            build.log
          if-no-files-found: error
          retention-days: 30
